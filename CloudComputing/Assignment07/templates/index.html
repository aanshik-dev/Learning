<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansik Singh Tomar | Personal Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 520px;
            width: 100%;
            border: 1px solid #334155;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .info-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .info-item {
            margin: 0.5rem 0;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        .info-item strong {
            color: #f1f5f9;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid #0284c7;
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">AST</div>
        <h1>Ansik Singh Tomar</h1>
        <p class="subtitle">Cloud Computing Portfolio</p>
        
        <div class="info-box">
            <div class="info-item"><strong>Roll Number:</strong> 2401037</div>
            <div class="info-item"><strong>Course:</strong> CS351 - Cloud Computing</div>
            <div class="info-item"><strong>Deployment:</strong> AWS Elastic Beanstalk (Python WSGI)</div>
        </div>

        <div class="badge">Deployed using AWS Boto3</div>
    </div>
</body>
</html>
